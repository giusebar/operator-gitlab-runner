name: gitlab-runner-operator
display-name: gitlab-runner-operator
summary: A gitlab-runner operator charm.
description: |
   Registers gitlab-runner instances with a gitlab server instance. Uses upstream gitlab-runner.
   Supports docker & lxd custom runners.
tags:
  - ops
subordinate: false

provides:
  scrape:
    interface: prometheus

docs: https://discourse.charmhub.io/t/gitlab-runner-docs-index/4581
